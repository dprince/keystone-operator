# This patch updates the controller manager to use built-in metrics authentication and authorization
# instead of kube-rbac-proxy sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--health-probe-bind-address=:8081"
        - "--metrics-bind-address=:8443"
        - "--leader-elect"
        ports:
        - containerPort: 8443
          protocol: TCP
          name: https
